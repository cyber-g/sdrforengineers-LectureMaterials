name: Build and Release

# Trigger configuration: specifies when this workflow runs
on:
  push:
    tags:
      - '*'  # Run workflow only when a tag is pushed (e.g., git push origin v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build lectures and labs
        run: |
          cd Slides
          make
          zip lectures.zip *.pdf
          zip labs.zip *.pdf
      
      - name: Create Release and Upload Assets
        run: |
          gh release create ${{ github.ref_name }} \
            ./Slides/lectures.zip \
            ./Slides/labs.zip \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

