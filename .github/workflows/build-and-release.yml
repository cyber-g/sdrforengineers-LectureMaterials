name: Build and Release

# Trigger configuration: specifies when this workflow runs
on:
  push:
    tags:
      - '*'  # Run workflow only when a tag is pushed (e.g., git push origin v1.0.0)

# Explicitly grant only the permissions needed
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      
      - name: Install GitHub CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gpg
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          apt-get install -y --no-install-recommends gh

      - name: Build lectures and labs
        run: |
          cd Slides
          make
          zip lectures.zip *.pdf
          zip labs.zip *.pdf
      
      - name: Create Release and Upload Assets
        run: |
          gh release create ${{ github.ref_name }} \
            ./Slides/lectures.zip \
            ./Slides/labs.zip \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

